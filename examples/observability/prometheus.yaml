global:
  evaluation_interval: 5s
otlp:
  # This naming contract is shared by the dashboard and alert rules. Do not silently change it.
  translation_strategy: UnderscoreEscapingWithoutSuffixes
  keep_identifying_resource_attributes: true
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - deployment.environment.name
    - jevable.storage.kind
    - k8s.namespace.name
    - k8s.pod.name
storage:
  tsdb:
    out_of_order_time_window: 5m
rule_files:
  - /jevable-observability/alerts.yaml
